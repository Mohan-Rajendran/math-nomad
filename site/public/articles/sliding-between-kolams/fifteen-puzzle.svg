    <text x="150" y="364" text-anchor="middle" fill="#fdfbf7" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="600">14</text>
    <rect x="203" y="303" width="94" height="94" rx="7" fill="#708077" />
    <text x="250" y="364" text-anchor="middle" fill="#fdfbf7" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="600">15</text>
    <rect x="310" y="310" width="80" height="80" rx="5" fill="none" stroke="#aaa49b" stroke-width="2" stroke-dasharray="6 6" />
